name: CD

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]

env:
  DOTNET_VERSION: "8.0.x"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sqlmcpserver

jobs:
  publish-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: publish-image
    environment:
      name: staging
      url: https://staging.sqlmcpserver.internal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}

      - name: Set AKS context (staging)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP_STAGING }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME_STAGING }}

      - name: Update image in staging
        run: |
          kubectl set image deployment/sqlmcpserver \
            sqlmcpserver=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.publish-image.outputs.image_digest }} \
            -n sqlmcpserver
          kubectl rollout status deployment/sqlmcpserver -n sqlmcpserver --timeout=120s

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [publish-image, deploy-staging]
    environment:
      name: production
      url: https://sqlmcpserver.internal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PRODUCTION }}

      - name: Set AKS context (production)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP_PROD }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME_PROD }}

      - name: Update image in production
        run: |
          kubectl set image deployment/sqlmcpserver \
            sqlmcpserver=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.publish-image.outputs.image_digest }} \
            -n sqlmcpserver
          kubectl rollout status deployment/sqlmcpserver -n sqlmcpserver --timeout=180s
