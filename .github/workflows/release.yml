name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  build-binaries:
    name: Build Self-Contained Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (${{ matrix.rid }})
        run: |
          dotnet publish src/SqlMcpServer.Host/SqlMcpServer.Host.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            /p:PublishSingleFile=true \
            /p:UseAppHost=true \
            -o ./artifacts/${{ matrix.rid }}

      - name: Package
        run: |
          cd ./artifacts
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -r sqlmcpserver-${{ github.ref_name }}-${{ matrix.rid }}.zip ${{ matrix.rid }}/
          else
            tar czf sqlmcpserver-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz ${{ matrix.rid }}/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: artifacts/sqlmcpserver-${{ github.ref_name }}-${{ matrix.rid }}.*

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-binaries

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@v3
        with:
          config: .cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SQL MCP Server ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.content }}
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
